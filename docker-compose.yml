# Servicios del proyecto weather. `postgres` es la base de datos local
# de desarrollo (credenciales coinciden con DATABASE_URL en .env, ver
# spec/db/general.md). `control-backend` y `control-frontend` son el
# panel de control, contenedorizados según spec/control/core.md,
# "Despliegue": el enrutado externo hacia ellos (dominio, TLS) lo hace
# el nginx del servidor de destino, gestionado fuera de este proyecto.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: weather
      POSTGRES_PASSWORD: weather
      POSTGRES_DB: weather
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  control-backend:
    build: ./control/backend
    restart: unless-stopped
    environment:
      # Dentro de la red de docker-compose, postgres se resuelve por
      # nombre de servicio en vez de localhost (ver spec/db/general.md
      # para el resto del DSN, credenciales de docker-compose).
      DATABASE_URL: postgresql+psycopg://weather:weather@postgres:5432/weather
      CONTROL_SESSION_TTL_MINUTOS: ${CONTROL_SESSION_TTL_MINUTOS:-15}
    depends_on:
      - postgres
    ports:
      - "8000:8000"

  control-frontend:
    build: ./control/frontend
    restart: unless-stopped
    depends_on:
      - control-backend
    ports:
      - "8083:80"

  # Servidor de desarrollo de Vite en contenedor: alternativa a instalar
  # node en local para trabajar en control/frontend/ (ver
  # control/frontend/README.md). No arranca con `docker compose up` porque
  # está en el perfil "dev": hay que pedirlo explícitamente con
  # `docker compose --profile dev up control-frontend-dev`.
  control-frontend-dev:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --port 5173"
    environment:
      # Dentro de la red de docker-compose, control-backend se resuelve
      # por nombre de servicio en vez de localhost (ver vite.config.js).
      VITE_PROXY_TARGET: http://control-backend:8000
    depends_on:
      - control-backend
    volumes:
      - ./control/frontend:/app
      - control_frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    profiles:
      - dev

volumes:
  postgres_data:
  control_frontend_node_modules:

# Services for the weather project. `postgres` is the local
# development database (credentials match DATABASE_URL in .env, see
# spec/db/general.md). `control-backend` and `control-frontend` are
# the control panel, containerized per spec/control/core.md,
# "Deployment": external routing to them (domain, TLS) is done by the
# target server's nginx, managed outside this project.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: weather
      POSTGRES_PASSWORD: weather
      POSTGRES_DB: weather
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  control-backend:
    build: ./control/backend
    restart: unless-stopped
    environment:
      # Within the docker-compose network, postgres resolves by
      # service name instead of localhost (see spec/db/general.md for
      # the rest of the DSN, docker-compose credentials).
      DATABASE_URL: postgresql+psycopg://weather:weather@postgres:5432/weather
      CONTROL_SESSION_TTL_MINUTES: ${CONTROL_SESSION_TTL_MINUTES:-15}
    depends_on:
      - postgres
    ports:
      - "8000:8000"

  control-frontend:
    build: ./control/frontend
    restart: unless-stopped
    depends_on:
      - control-backend
    ports:
      - "8083:80"

  # Containerized Vite dev server: alternative to installing node
  # locally to work on control/frontend/ (see
  # control/frontend/README.md). Doesn't start with `docker compose up`
  # because it's in the "dev" profile: it must be requested explicitly
  # with `docker compose --profile dev up control-frontend-dev`.
  control-frontend-dev:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --port 5173"
    environment:
      # Within the docker-compose network, control-backend resolves by
      # service name instead of localhost (see vite.config.js).
      VITE_PROXY_TARGET: http://control-backend:8000
    depends_on:
      - control-backend
    volumes:
      - ./control/frontend:/app
      - control_frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    profiles:
      - dev

volumes:
  postgres_data:
  control_frontend_node_modules:

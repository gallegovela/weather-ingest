name: Deploy

# Continuous deployment: every push to `main` pulls (or clones, on the
# first run) the persistent checkout at `SOURCE_PATH` on the runner's
# host, then rebuilds and restarts the docker-compose stack there. See
# spec/deploy.md for the full rationale (why SOURCE_PATH instead of
# actions/checkout, queue-don't-cancel, no rollback on build failure).

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ionos-l1-docker
    # GH_TOKEN: the variable `gh` reads (spec/deploy.md, "Design notes").
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      # All GitHub access goes through gh: `gh repo clone` on the first
      # run, and `gh auth git-credential` as a one-off credential helper
      # (`git -c`, nothing persisted) for later pulls. The remote URL
      # carries no token, so none is left in SOURCE_PATH's .git/config.
      - name: Pull or clone the persistent checkout
        env:
          SOURCE_PATH: ${{ secrets.SOURCE_PATH }}
        run: |
          if [ -d "$SOURCE_PATH" ]; then
            git -C "$SOURCE_PATH" remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
            git -C "$SOURCE_PATH" \
              -c credential.https://github.com.helper= \
              -c 'credential.https://github.com.helper=!gh auth git-credential' \
              pull
          else
            gh repo clone "$GITHUB_REPOSITORY" "$SOURCE_PATH" -- --branch main
          fi

      - name: Rebuild and restart the stack
        env:
          SOURCE_PATH: ${{ secrets.SOURCE_PATH }}
        run: |
          cd "$SOURCE_PATH"
          docker-compose down
          docker-compose build --no-cache
          docker-compose up -d

name: Issue pipeline

# Label-gated stages, each running the local `claude` CLI on the
# ionosL1 self-hosted runner, authenticated via CLAUDE_CODE_OAUTH_TOKEN
# (a long-lived token from `claude setup-token`, stored as an
# organization secret) -- not the anthropics/claude-code-action
# marketplace action, which would need a redundant second auth path,
# and not an interactive login on the runner host either (the token is
# supplied per-run, nothing persists on the runner). See
# spec/issue_pipeline.md for the full rationale.
#
# documentation  -> architect agent proposes a spec/ change plan,
#                   commented on the issue. No writes.
# preparation    -> create/reuse branch issue-<n>, architect agent
#                   applies the spec/ changes, workflow commits, pushes.
# implementation -> on branch issue-<n>, developer agent implements the
#                   code, workflow commits, pushes.
# merge          -> plain bash (no agent): open a PR from issue-<n> to
#                   the default branch.
#
# Agents (prompt, model, tools) live in .claude/agents/, not here.
# Agents never talk to GitHub: every GitHub interaction is a workflow
# step running gh, and GH_TOKEN is only declared on those steps, never
# on the "Run Claude" ones.
#
# Re-triggers on a comment too (not just a fresh label), so answering
# a clarifying question in the thread re-runs the *current* label's
# stage without having to remove/re-add it.

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

# Only governs the auto-generated github.token, which nothing here uses
# (every GitHub call goes through gh + GH_TOKEN) -- kept at the minimum.
permissions:
  contents: read

env:
  # Org-level secret: a long-lived token from `claude setup-token`,
  # not a per-user OAuth browser session -- lets every job authenticate
  # without any interactive login step on the runner itself.
  CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
  ISSUE_NUMBER: ${{ github.event.issue.number }}

jobs:
  check-permission:
    # Hand-invoking the CLI (instead of the marketplace action) means
    # we lose its built-in write-access check -- added back here,
    # once, shared by every stage job via `needs`.
    runs-on: ionos-l1-claude
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          perm=$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${{ github.actor }}/permission" --jq .permission)
          if [ "$perm" = "admin" ] || [ "$perm" = "write" ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          fi

  documentation:
    needs: check-permission
    if: needs.check-permission.outputs.allowed == 'true' && ((github.event_name == 'issues' && github.event.label.name == 'documentation') || (github.event_name == 'issue_comment' && contains(github.event.issue.labels.*.name, 'documentation')))
    runs-on: ionos-l1-claude
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: false

      # Saved outside the checkout so it can never end up committed.
      - name: Fetch issue thread
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh issue view "$ISSUE_NUMBER" > "$RUNNER_TEMP/issue.md"
          gh issue view "$ISSUE_NUMBER" --comments >> "$RUNNER_TEMP/issue.md"

      - name: Run Claude
        run: |
          set -o pipefail
          claude -p "Stage: documentation. Issue #$ISSUE_NUMBER. The issue and its full comment thread are in $RUNNER_TEMP/issue.md." \
            --agent architect \
            --disallowedTools "Write Edit" \
            --dangerously-skip-permissions \
            --output-format text \
            --max-budget-usd 2 \
            | tee "$RUNNER_TEMP/claude_output.txt"

      - name: Check no files were modified
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::documentation must not modify files"
            git status --porcelain
            exit 1
          fi

      - name: Post result comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/claude_output.txt"

  preparation:
    needs: check-permission
    if: needs.check-permission.outputs.allowed == 'true' && ((github.event_name == 'issues' && github.event.label.name == 'preparation') || (github.event_name == 'issue_comment' && contains(github.event.issue.labels.*.name, 'preparation')))
    runs-on: ionos-l1-claude
    steps:
      # persist-credentials: false -- otherwise checkout leaves its own
      # extraheader credential in .git/config, which would take
      # precedence over gh's credential helper below (and which the
      # agent could use).
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: false

      # Same helper `gh auth setup-git` would install, but scoped to
      # this checkout (--local) instead of the runner's global config.
      # It only works in steps that have GH_TOKEN in their env.
      - name: Configure git
        run: |
          git config --local credential.https://github.com.helper ''
          git config --local --add credential.https://github.com.helper '!gh auth git-credential'
          git config user.name "Claude (automated)"
          git config user.email "noreply@anthropic.com"

      - name: Create or reuse the issue branch
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          BRANCH="issue-$ISSUE_NUMBER"
          git fetch origin "$BRANCH" 2>/dev/null || true
          if git show-ref --verify --quiet "refs/remotes/origin/$BRANCH"; then
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout -b "$BRANCH"
          fi

      - name: Fetch issue thread
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh issue view "$ISSUE_NUMBER" > "$RUNNER_TEMP/issue.md"
          gh issue view "$ISSUE_NUMBER" --comments >> "$RUNNER_TEMP/issue.md"

      - name: Run Claude
        run: |
          set -o pipefail
          claude -p "Stage: preparation. Issue #$ISSUE_NUMBER, branch issue-$ISSUE_NUMBER. The issue and its full comment thread are in $RUNNER_TEMP/issue.md." \
            --agent architect \
            --dangerously-skip-permissions \
            --output-format text \
            --max-budget-usd 4 \
            | tee "$RUNNER_TEMP/claude_output.txt"

      - name: Commit and push spec/ changes
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          outside=$(git diff --cached --name-only | grep -v '^spec/' || true)
          if [ -n "$outside" ]; then
            echo "::error::preparation must only change spec/, found:"
            echo "$outside"
            exit 1
          fi
          git commit -m "Update spec for #$ISSUE_NUMBER (automated)"
          git push -u origin "issue-$ISSUE_NUMBER"

      - name: Post result comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/claude_output.txt"

  implementation:
    needs: check-permission
    if: needs.check-permission.outputs.allowed == 'true' && ((github.event_name == 'issues' && github.event.label.name == 'implementation') || (github.event_name == 'issue_comment' && contains(github.event.issue.labels.*.name, 'implementation')))
    runs-on: ionos-l1-claude
    steps:
      - uses: actions/checkout@v6
        with:
          ref: issue-${{ github.event.issue.number }}
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: false

      - name: Configure git
        run: |
          git config --local credential.https://github.com.helper ''
          git config --local --add credential.https://github.com.helper '!gh auth git-credential'
          git config user.name "Claude (automated)"
          git config user.email "noreply@anthropic.com"

      - name: Fetch issue thread
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh issue view "$ISSUE_NUMBER" > "$RUNNER_TEMP/issue.md"
          gh issue view "$ISSUE_NUMBER" --comments >> "$RUNNER_TEMP/issue.md"

      - name: Run Claude
        run: |
          set -o pipefail
          claude -p "Stage: implementation. Issue #$ISSUE_NUMBER, branch issue-$ISSUE_NUMBER. The issue and its full comment thread are in $RUNNER_TEMP/issue.md." \
            --agent developer \
            --dangerously-skip-permissions \
            --output-format text \
            --max-budget-usd 8 \
            | tee "$RUNNER_TEMP/claude_output.txt"

      - name: Commit and push
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Implement #$ISSUE_NUMBER (automated)"
          git push origin "issue-$ISSUE_NUMBER"

      - name: Post result comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/claude_output.txt"

  # No agent and no checkout: everything goes through the API (GH_REPO
  # tells gh which repository). See spec/issue_pipeline.md ("merge
  # stage").
  merge:
    needs: check-permission
    if: needs.check-permission.outputs.allowed == 'true' && ((github.event_name == 'issues' && github.event.label.name == 'merge') || (github.event_name == 'issue_comment' && contains(github.event.issue.labels.*.name, 'merge')))
    runs-on: ionos-l1-claude
    steps:
      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          BRANCH="issue-$ISSUE_NUMBER"
          BASE=$(gh repo view --json defaultBranchRef --jq .defaultBranchRef.name)

          existing=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // empty')
          if [ -n "$existing" ]; then
            echo "A pull request from \`$BRANCH\` is already open: $existing" > "$RUNNER_TEMP/result.md"
            exit 0
          fi

          TITLE=$(gh issue view "$ISSUE_NUMBER" --json title --jq .title)
          COMMITS=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$BRANCH" \
            --jq '.commits[] | "- \(.sha[0:7]) \(.commit.message | split("\n")[0])"')
          {
            echo "Closes #$ISSUE_NUMBER"
            echo
            echo "## Commits"
            echo
            echo "$COMMITS"
          } > "$RUNNER_TEMP/pr_body.md"

          url=$(gh pr create --base "$BASE" --head "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/pr_body.md")
          echo "Pull request opened: $url" > "$RUNNER_TEMP/result.md"

      - name: Post result comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ ! -s "$RUNNER_TEMP/result.md" ]; then
            echo "The merge stage failed, see $RUN_URL" > "$RUNNER_TEMP/result.md"
          fi
          gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/result.md"

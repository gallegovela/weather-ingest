# Alembic configuration for the independent database build module.
# See spec/db/general.md for the detail of the process, conventions
# and workflow.
#
# Always invoked through db/migrate.py, which runs alembic with
# cwd=db/ so that script_location's relative path resolves correctly.

[alembic]
script_location = migrations

# Migration file name convention: date/time + revision hash + readable
# slug, so files sort chronologically in a directory listing.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

prepend_sys_path = .
version_path_separator = os

# The actual connection URL is NOT set here: it's set at runtime by
# migrations/env.py, reading DATABASE_URL from the project root's
# .env. Left empty on purpose.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %%(levelname)-5.5s [%%(name)s] %%(message)s
datefmt = %%H:%%M:%%S

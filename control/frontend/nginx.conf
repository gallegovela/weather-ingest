# Servidor estático de la SPA dentro del contenedor. El fallback a
# index.html es necesario porque el enrutado es del lado del cliente
# (react-router-dom, ver spec/control/core.md).
#
# El proxy de /api hacia control-backend (nombre de servicio resuelto
# por la red de docker-compose, ver docker-compose.yml) hace que el
# contenedor funcione de forma autónoma con `docker compose up` en
# local, igual que ya hace el proxy de vite.config.js en desarrollo.
# En el servidor de destino real, el nginx externo (fuera de este
# proyecto, ver spec/control/core.md) puede seguir enrutando /api
# directamente a control-backend sin pasar por aquí; si en cambio
# reenvía todo el tráfico a este contenedor, este proxy también lo
# resuelve correctamente.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /api {
        proxy_pass http://control-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

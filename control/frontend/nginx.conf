# Static server for the SPA inside the container. The fallback to
# index.html is needed because routing is client-side
# (react-router-dom, see spec/control/core.md).
#
# The /api proxy to control-backend (service name resolved by the
# docker-compose network, see docker-compose.yml) makes the container
# work autonomously with `docker compose up` locally, same as
# vite.config.js's proxy already does in development. On the actual
# target server, the external nginx (outside this project, see
# spec/control/core.md) can keep routing /api directly to
# control-backend without going through here; if it instead forwards
# all traffic to this container, this proxy resolves it correctly too.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /api {
        proxy_pass http://control-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Servidor estático de la SPA dentro del contenedor. El fallback a
# index.html es necesario porque el enrutado es del lado del cliente
# (react-router-dom, ver spec/control/core.md); el proxy hacia
# control-backend para /api lo hace el nginx externo del servidor de
# destino, no este fichero (ver Dockerfile).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
